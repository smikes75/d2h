name: Build Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            d2h-rust
            d2h-rust/src-tauri

      # System libraries required to build a Tauri v2 app on Linux
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Cache tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2-${{ runner.os }}

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2"

      - name: Run tests
        run: cargo test
        working-directory: d2h-rust

      # AppImage + .deb (both are produced by the default bundler on Linux)
      - name: Build Tauri app
        run: cargo tauri build
        working-directory: d2h-rust

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: D2H-linux-appimage
          path: d2h-rust/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: D2H-linux-deb
          path: d2h-rust/src-tauri/target/release/bundle/deb/*.deb

      - name: Upload portable binary
        uses: actions/upload-artifact@v4
        with:
          name: D2H-linux-portable
          path: d2h-rust/src-tauri/target/release/d2h-gui
