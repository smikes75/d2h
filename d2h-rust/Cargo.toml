[package]
name = "d2h"
version = "0.1.0"
edition = "2021"
description = "Directory to HTML — generates browseable directory structure"

[lib]
name = "d2h"
path = "src/lib.rs"

[[bin]]
name = "d2h"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

[profile.release]
opt-level = "z"
lto = true
strip = true
