[package]
name = "d2h-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
d2h = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }
