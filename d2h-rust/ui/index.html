            name.textContent = 'D2H';
            box.appendChild(name);

            var ver = document.createElement('div');
            ver.className = 'about-version';
            ver.textContent = document.getElementById('app-version').textContent
                + ' · Directory to HTML catalog generator';
            box.appendChild(ver);

            var copyright = document.createElement('div');
            copyright.className = 'about-line';
            copyright.appendChild(document.createTextNode('© 2026 DataHelp — '));
            copyright.appendChild(aboutLink('datahelp.eu', D2H_AUTHOR_URL));
            box.appendChild(copyright);

            var lic = document.createElement('div');
            lic.className = 'about-line';
            lic.appendChild(document.createTextNode('Free and open source — '));
            lic.appendChild(aboutLink('MIT License', D2H_REPO_URL + '/blob/main/LICENSE'));
            box.appendChild(lic);

            var src = document.createElement('div');
            src.className = 'about-line';
            src.appendChild(document.createTextNode('Source code: '));
            src.appendChild(aboutLink('github.com/smikes75/d2h', D2H_REPO_URL));
            box.appendChild(src);

            if (D2H_DONATE_URL) {
                var don = document.createElement('div');
                don.className = 'about-donate';
                var donLine = document.createElement('div');
                donLine.className = 'about-line';
                donLine.appendChild(document.createTextNode('☕ Enjoying D2H? '));
                donLine.appendChild(aboutLink('Buy me a coffee (€5)', D2H_DONATE_URL));
                don.appendChild(donLine);
                var qrWrap = document.createElement('div');
                qrWrap.className = 'about-qr';
                qrWrap.innerHTML = D2H_DONATE_QR;
                don.appendChild(qrWrap);
                var qrHint = document.createElement('div');
                qrHint.className = 'about-line about-qr-hint';
                qrHint.textContent = 'Scan with your phone';
                don.appendChild(qrHint);
                box.appendChild(don);
            }

            var btnRow = document.createElement('div');
            btnRow.className = 'dialog-buttons';
            var okBtn = document.createElement('button');
            okBtn.className = 'btn btn-primary';
            okBtn.textContent = t('btnOk');
            okBtn.addEventListener('click', function() { modal.remove(); });
            btnRow.appendChild(okBtn);
            box.appendChild(btnRow);

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) modal.remove();
            });
            overlay.appendChild(box);
            modal.appendChild(overlay);
            document.body.appendChild(modal);
        }

        document.getElementById('app-title').addEventListener('click', showAboutModal);
        document.getElementById('app-version').addEventListener('click', showAboutModal);

        // =====================================================================
        // Dialog Modal (created dynamically) — localized via question.id/params
        // =====================================================================

        var DIALOG_I18N = {
            'file_exists':       { title: 'dlgFileExistsTitle', message: 'dlgFileExistsMsg' },
            'rename_input':      { title: 'dlgRenameTitle', message: 'dlgRenameMsg', inputLabel: 'dlgFilename' },
            'invalid_case':      { title: 'dlgInvalidJobTitle', message: 'dlgInvalidJobMsg' },
            'rename_case_input': { title: 'dlgRenameTitle', inputLabel: 'dlgJobNumber' }
        };
        var DIALOG_BTN_KEYS = {
            'overwrite': 'btnOverwrite',
            'rename': 'btnRename',
            'cancel': 'btnCancel',
            'ok': 'btnOk',
            'keep': 'btnKeep'
        };

        // Translate dialog title/message/input-label by question.id; interpolate
        // {0},{1}… with question.params. Unknown ids fall back to backend strings.
        function translateDialog(question) {
            var params = question.params || [];
            var out = {
                title: question.title || 'Dialog',
                message: question.message || '',
                inputLabel: (question.input && question.input.label) || ''
            };
            var map = DIALOG_I18N[question.id];
            if (map) {
                if (map.title) out.title = t(map.title);
                if (map.message) {
                    var tmpl = t(map.message);
                    // If the template needs params but none arrived, keep backend text
                    if (/\{\d+\}/.test(tmpl) && params.length === 0 && question.message) {
                        out.message = question.message;
                    } else {
                        out.message = fmt(tmpl, params);
                    }
                }
                if (map.inputLabel && question.input) out.inputLabel = t(map.inputLabel);
            }
            return out;
        }

        function translateDialogButton(btn) {
            var key = DIALOG_BTN_KEYS[btn.id];
            return key && UI.en[key] ? t(key) : btn.label;
        }

        function showDialogModal(question) {
            try {
                // Remove any existing modal
                var old = document.getElementById('dialog-modal');
                if (old) old.remove();

                var texts = translateDialog(question);

                // Create modal DOM
                var modal = document.createElement('div');
                modal.id = 'dialog-modal';

                var overlay = document.createElement('div');
                overlay.className = 'dialog-overlay';

                var box = document.createElement('div');
                box.className = 'dialog-box';

                var titleEl = document.createElement('div');
                titleEl.className = 'dialog-title';
                titleEl.textContent = texts.title;

                var msgEl = document.createElement('div');
                msgEl.className = 'dialog-message';
                msgEl.textContent = texts.message;

                // Optional text input
                var inputEl = null;
                if (question.input) {
                    var inputWrap = document.createElement('div');
                    inputWrap.style.cssText = 'margin-bottom: 16px;';

                    var inputLabel = document.createElement('label');
                    inputLabel.style.cssText = 'display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;';
                    inputLabel.textContent = texts.inputLabel;
                    inputWrap.appendChild(inputLabel);

                    inputEl = document.createElement('input');
                    inputEl.type = 'text';
                    inputEl.value = question.input.default_value || '';
                    inputEl.style.cssText = 'width: 100%; padding: 8px 10px; border: 1px solid var(--border); background: var(--input-bg); font-size: 14px; box-sizing: border-box;';
                    inputWrap.appendChild(inputEl);

                    box.appendChild(titleEl);
                    box.appendChild(msgEl);
                    box.appendChild(inputWrap);
                } else {
                    box.appendChild(titleEl);
                    box.appendChild(msgEl);
                }

                var btnContainer = document.createElement('div');
                btnContainer.className = 'dialog-buttons';

                function closeDialog(answerId) {
                    // For input dialogs, send the typed value with an "input:" prefix
                    // so the backend can tell it apart from button ids (a user
                    // literally typing "cancel" must not cancel the run).
                    var answer = answerId;
                    if (inputEl && answerId !== 'cancel') {
                        answer = 'input:' + inputEl.value.trim();
                    }
                    modal.remove();
                    logLine('User chose: ' + answer, 'info');
                    invoke('answer_dialog', { answer: answer });
                }

                var buttons = question.buttons || [];
                buttons.forEach(function(btn) {
                    var el = document.createElement('button');
                    el.className = 'btn';
                    if (btn.style === 'warning') el.className += ' btn-warning';
                    if (btn.style === 'primary') el.className += ' btn-primary';
                    el.textContent = translateDialogButton(btn);
                    el.addEventListener('click', function() { closeDialog(btn.id); });
                    btnContainer.appendChild(el);
                });

                box.appendChild(btnContainer);

                // Click overlay to cancel
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) { closeDialog('cancel'); }
                });

                // Enter key confirms (for input dialogs)
                if (inputEl) {
                    inputEl.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') { closeDialog('ok'); }
                        if (e.key === 'Escape') { closeDialog('cancel'); }
                    });
                }

                overlay.appendChild(box);
                modal.appendChild(overlay);
                document.body.appendChild(modal);

                // Focus the input if present
                if (inputEl) {
                    inputEl.focus();
                    inputEl.select();
                }

                logLine('Dialog shown: ' + (texts.title || '?'), 'info');
            } catch (err) {
                logLine('Dialog error: ' + err, 'error');
                invoke('answer_dialog', { answer: 'cancel' });
            }
        }

        // --- Init ---
        buildLangMenu();
        // The lang button is the first focusable element; a stray Enter/Space
        // right after launch (e.g. dismissing the OS security prompt) would
        // open the menu. Drop any initial focus so keys land nowhere.
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        syncFormatCards();
        setStatus('idle');
        // Apply language immediately (localStorage -> navigator); config default
        // (defaults.uiLanguage) is applied later when get_config resolves.
        setUILanguage(lsGet('d2h_ui_lang') || detectNavLang(), false);
        updateGenerateButton();
    </script>

</body>
</html>
