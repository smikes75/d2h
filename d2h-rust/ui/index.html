<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2H — Directory to HTML</title>
    <style>
        /* === D2H GUI Design === */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f0f2f5;
            --panel-bg: #ffffff;
            --header-bg: #1a1a2e;
            --accent: #16697a;
            --accent-hover: #1a7f94;
            --accent-soft: #eef6f8;
            --text: #212529;
            --text-secondary: #6c757d;
            --border: #dee2e6;
            --input-bg: #f8f9fa;
            --success: #28a745;
            --error: #dc3545;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        .gui-header {
            background: var(--header-bg);
            color: white;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .gui-header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            cursor: pointer;
        }
        .gui-header .version {
            font-size: 11px;
            opacity: 0.5;
            margin-left: 10px;
            cursor: pointer;
        }
        .about-box { text-align: center; }
        .about-box .about-icon svg { display: block; margin: 0 auto 10px; }
        .about-box .about-name { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
        .about-box .about-version { font-size: 12px; color: var(--text-dim, #777); margin-bottom: 14px; }
        .about-box .about-line { font-size: 13px; margin: 4px 0; }
        .about-box .about-link { color: var(--accent); cursor: pointer; text-decoration: underline; }
        .about-box .about-donate { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); }
        .about-box .about-qr svg { display: block; margin: 8px auto 2px; border: 1px solid rgba(0,0,0,0.12); border-radius: 6px; }
        .about-box .about-qr-hint { font-size: 11px; color: var(--text-dim, #777); }

        /* --- Language dropdown --- */
        .lang-switch {
            margin-left: auto;
            position: relative;
        }
        .lang-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 4px;
            color: #fff;
            padding: 4px 9px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.5px;
            transition: background 0.15s;
        }
        .lang-btn:hover { background: rgba(255,255,255,0.18); }
        .lang-flag { display: flex; align-items: center; }
        .lang-flag svg { display: block; }
        .lang-caret { font-size: 9px; opacity: 0.7; }
        .lang-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.28);
            min-width: 160px;
            z-index: 10000;
            padding: 4px 0;
        }
        .lang-menu.open { display: block; }
        .lang-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 14px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
        }
        .lang-item:hover { background: var(--input-bg); }
        .lang-item.active { background: var(--accent-soft); font-weight: 600; }
        .lang-item .lang-flag svg { display: block; }

        /* --- Customize (gear) button --- */
        .gear-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 4px;
            color: #fff;
            padding: 4px 7px;
            height: 26px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .gear-btn:hover { background: rgba(255,255,255,0.18); }
        .gear-btn svg { display: block; }

        /* --- Customize modal extras --- */
        .cust-field { margin-bottom: 12px; }
        .cust-field > label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .cust-row { display: flex; gap: 6px; align-items: center; }
        .cust-row input[type="color"] {
            width: 44px;
            height: 30px;
            padding: 2px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            cursor: pointer;
        }
        .cust-note {
            font-size: 11.5px;
            color: var(--text-secondary);
            line-height: 1.4;
            margin: 4px 0 16px;
        }
        .btn-clear {
            padding: 7px 10px;
            font-size: 13px;
            line-height: 1;
        }

        /* --- Main Layout --- */
        .gui-main {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 1px;
            background: var(--border);
        }

        /* --- Left Panel: Configuration --- */
        .config-panel {
            width: 380px;
            min-width: 320px;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .config-section {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .config-section:last-child { border-bottom: none; }

        .config-section.push-bottom { margin-top: auto; }
        .config-section h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 600;
        }

        /* --- Form Elements --- */
        .field {
            margin-bottom: 10px;
        }
        .field:last-child { margin-bottom: 0; }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .field-row {
            display: flex;
            gap: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 7px 10px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        input[type="text"]::placeholder {
            color: #adb5bd;
        }

        select.d2h-select {
            width: 100%;
            padding: 7px 10px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            outline: none;
        }

        .btn {
            padding: 7px 14px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--panel-bg);
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover {
            background: var(--input-bg);
            border-color: #adb5bd;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .btn-primary:disabled {
            background: #adb5bd;
            border-color: #adb5bd;
            cursor: not-allowed;
        }

        .btn-full {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
        }

        /* --- Drop zone --- */
        .drop-zone {
            border: 1.5px dashed var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            padding: 22px 14px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }
        .drop-zone:hover, .drop-zone.dragging {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .drop-zone .dz-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            flex-wrap: wrap;
        }
        .drop-zone .dz-empty b { color: var(--accent); font-weight: 600; }
        .drop-zone .dz-empty svg, .drop-zone .dz-selected svg { flex: none; }
        .drop-zone.selected {
            border-style: solid;
            background: var(--panel-bg);
            padding: 10px 12px;
        }
        .drop-zone.selected:hover { background: var(--accent-soft); }
        /* Visibility is class-driven on the parent — Tauri's CSP strips
           inline style attributes (style-src hash beats 'unsafe-inline'),
           so `style="display:none"` in markup silently does nothing. */
        .drop-zone .dz-selected { display: none; }
        .drop-zone.selected .dz-empty { display: none; }
        .drop-zone.selected .dz-selected {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .drop-zone .dz-meta { min-width: 0; flex: 1; text-align: left; }
        .drop-zone .dz-name {
            font-size: 13.5px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .drop-zone .dz-path {
            font-size: 11.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: rtl;
            text-align: left;
        }
        .drop-zone .dz-change {
            flex: none;
            font-size: 12px;
            color: var(--accent);
            text-decoration: underline;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            padding: 2px 4px;
        }

        /* --- Format cards --- */
        .format-cards {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .format-card {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 30px 10px 12px;
            background: var(--panel-bg);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
            user-select: none;
        }
        .format-card:hover {
            border-color: #adb5bd;
            background: var(--input-bg);
        }
        .format-card.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            box-shadow: inset 0 0 0 1px var(--accent);
        }
        .format-card .format-icon { font-size: 18px; line-height: 1.3; }
        .format-card .format-title { font-size: 13px; font-weight: 600; }
        .format-card .format-desc {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 2px;
            line-height: 1.35;
        }
        .format-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        @keyframes format-card-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .format-card.shake { animation: format-card-shake 0.25s ease-in-out; }

        /* --- Advanced (collapsible) --- */
        details.advanced summary {
            cursor: pointer;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            color: var(--text-secondary);
            user-select: none;
            list-style: none;
        }
        details.advanced summary::-webkit-details-marker { display: none; }
        details.advanced summary::before {
            content: "\25B8";
            display: inline-block;
            margin-right: 6px;
            transition: transform 0.15s;
        }
        details.advanced[open] summary::before { transform: rotate(90deg); }
        details.advanced summary:hover { color: var(--text); }
        details.advanced[open] summary { margin-bottom: 12px; }

        /* --- Toggles --- */
        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        /* --- Progress bar (inside status card) --- */
        .progress-bar-wrapper {
            height: 4px;
            background: #e9ecef;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 2px;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
            width: 0%;
        }
        .progress-bar.indeterminate {
            width: 30%;
            animation: progress-slide 1.2s ease-in-out infinite;
        }
        @keyframes progress-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        /* --- Dialog Modal --- */
        .dialog-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dialog-box {
            background: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            padding: 24px;
            min-width: 400px;
            max-width: 520px;
        }
        .dialog-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text);
        }
        .dialog-message {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }
        .dialog-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .dialog-buttons .btn { min-width: 90px; }
        .dialog-buttons .btn.btn-warning {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }
        .dialog-buttons .btn.btn-warning:hover {
            background: #c82333;
        }
        .dialog-buttons .btn.btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .dialog-buttons .btn.btn-primary:hover {
            background: var(--accent-hover);
        }

        /* --- Right Panel: Status + Log --- */
        .preview-panel {
            flex: 1;
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .status-wrap {
            padding: 14px;
            flex-shrink: 0;
        }
        .status-card {
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            background: var(--input-bg);
            padding: 14px 16px;
        }
        .status-card.idle {
            border-left-color: var(--border);
            color: var(--text-secondary);
            font-size: 13px;
        }
        .status-card.success {
            border-left-color: var(--accent);
            background: #eef5f6;
            border-color: #cfe3e6;
        }
        .status-card.error {
            border-left-color: var(--error);
            background: #fdf1f3;
            border-color: #f8bbd0;
        }
        .status-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .status-card.success .status-title { color: var(--accent); }
        .status-card.error .status-title { color: var(--error); }
        .status-line { font-size: 13px; margin-bottom: 3px; word-break: break-all; }
        .status-line.warn { color: #e65100; font-weight: 600; }
        .status-line.ok { color: #1b7a3d; font-weight: 600; }
        .status-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .status-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #cdd6dd;
            border-top-color: var(--accent);
            border-radius: 50%;
            flex-shrink: 0;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #progress-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* --- Log (collapsible) --- */
        .log-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-top: 1px solid var(--border);
        }
        .log-header {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--input-bg);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .log-header:hover { color: var(--text); }
        .log-chevron {
            display: inline-block;
            transition: transform 0.15s;
            font-size: 10px;
        }
        .log-section.open .log-chevron { transform: rotate(90deg); }
        .log-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
            font-size: 12px;
            background: #1e1e2e;
            color: #cdd6f4;
            display: none;
        }
        .log-section.open .log-content { display: block; }
        .log-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
        .log-line.warning { color: #f9e2af; }
        .log-line.error { color: #f38ba8; }
        .log-line.success { color: #a6e3a1; }
        .log-line.info { color: #89b4fa; }
    </style>
</head>
<body>
    <div class="gui-header">
        <h1 id="app-title" data-i18n-title="about" title="About">D2H</h1>
        <span class="version" id="app-version" data-i18n-title="about" title="About">v1.7.0-beta</span>
        <div class="lang-switch" id="lang-switch">
            <button class="lang-btn" id="lang-btn" aria-haspopup="listbox">
                <span class="lang-flag" id="lang-flag"></span>
                <span id="lang-code">EN</span>
                <span class="lang-caret">&#9662;</span>
            </button>
            <div class="lang-menu" id="lang-menu"></div>
        </div>
        <button class="gear-btn" id="btn-customize" data-i18n-title="customize" title="Customize" aria-haspopup="dialog">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>

    <div class="gui-main">
        <!-- Left Panel: Configuration -->
        <div class="config-panel">
            <div class="config-section">
                <h2 data-i18n="sectionSource" data-i18n-num="1">Source</h2>
                <div class="field">
                    <div class="drop-zone" id="drop-zone">
                        <div class="dz-empty" id="dz-empty">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <span data-i18n="dropHint">Drop a folder here or</span>
                            <b data-i18n="browseLink">browse&#8230;</b>
                        </div>
                        <div class="dz-selected" id="dz-selected">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <div class="dz-meta">
                                <div class="dz-name" id="dz-name"></div>
                                <div class="dz-path" id="dz-path"></div>
                            </div>
                            <button class="dz-change" data-i18n="changeDir">change</button>
                        </div>
                        <input type="text" id="input-dir" readonly hidden>
                    </div>
                </div>
            </div>

            <div class="config-section">
                <h2 data-i18n="sectionOutput" data-i18n-num="2">Output</h2>
                <div class="field">
                    <label data-i18n="outputFormat">Output format</label>
                    <div class="format-cards">
                        <div class="format-card" id="card-web" role="checkbox" aria-checked="false" tabindex="0">
                            <div class="format-icon">&#127760;</div>
                            <div class="format-info">
                                <div class="format-title" data-i18n="webCardTitle">Web package (.tar.gz)</div>
                                <div class="format-desc" data-i18n="webCardDesc">Upload to your server, send the customer a link</div>

        var uiLang = 'en';

        function t(key) {
            return (UI[uiLang] && UI[uiLang][key]) || UI.en[key] || key;
        }

        function fmt(template, params) {
            params = params || [];
            return String(template).replace(/\{(\d+)\}/g, function(m, i) {
                var v = params[parseInt(i, 10)];
                return (v === undefined || v === null) ? m : v;
            });
        }

        function lsGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function lsSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }

        // Map a BCP-47 / POSIX locale string to a UI language code, or null.
        function mapLocale(locale) {
            var n = (locale || '').toLowerCase();
            if (n.indexOf('cs') === 0) return 'cz';
            if (n.indexOf('de') === 0) return 'de';
            if (n.indexOf('it') === 0) return 'it';
            if (n.indexOf('es') === 0) return 'es';
            if (n.indexOf('fr') === 0) return 'fr';
            if (n.indexOf('pl') === 0) return 'pl';
            if (n.indexOf('en') === 0) return 'en';
            return null;
        }

        // navigator.language is unreliable in WebViews (WKWebView reports the
        // app bundle localization, i.e. 'en'); the real OS locale arrives
        // later via get_config (osLocale) and upgrades this initial guess.
        function detectNavLang() {
            return mapLocale(navigator.language) || 'en';
        }

        function setUILanguage(lang, persist) {
            if (!UI[lang]) lang = 'en';
            uiLang = lang;
            if (persist) lsSet('d2h_ui_lang', lang);

            // The flag is the master language: clicking it (persist=true)
            // clears any stored catalog-language override, so the catalog
            // follows the flag again. The override lives only from a manual
            // change in settings until the next flag click.
            if (persist && appConfig && appConfig.defaults && appConfig.defaults.language) {
                appConfig.defaults.language = null;
                logLine('Catalog language now follows the app language', 'info');
                if (invoke) {
                    invoke('save_config', { config: appConfig })
                        .catch(function(e) { logLine('save_config error: ' + e, 'error'); });
                }
            }

            // Static labels
            var nodes = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < nodes.length; i++) {
                var el = nodes[i];
                var txt = t(el.getAttribute('data-i18n'));
                var num = el.getAttribute('data-i18n-num');
                if (num) txt = num + ' · ' + txt;
                el.textContent = txt;
            }
            // Placeholders
            var phNodes = document.querySelectorAll('[data-i18n-placeholder]');
            for (var j = 0; j < phNodes.length; j++) {
                phNodes[j].setAttribute('placeholder', t(phNodes[j].getAttribute('data-i18n-placeholder')));
            }
            // Tooltips (title attribute)
            var titleNodes = document.querySelectorAll('[data-i18n-title]');
            for (var m = 0; m < titleNodes.length; m++) {
                titleNodes[m].setAttribute('title', t(titleNodes[m].getAttribute('data-i18n-title')));
            }

            // Flag button
            var flagEl = document.getElementById('lang-flag');
            if (flagEl) flagEl.innerHTML = FLAG_SVG[lang] || FLAG_SVG.en;
            var codeEl = document.getElementById('lang-code');
            if (codeEl) codeEl.textContent = lang.toUpperCase();

            // Menu active state
            var items = document.querySelectorAll('.lang-item');
            for (var k = 0; k < items.length; k++) {
                items[k].classList.toggle('active', items[k].getAttribute('data-lang') === lang);
            }

            renderStatus();
        }

        function buildLangMenu() {
            var menu = document.getElementById('lang-menu');
            while (menu.firstChild) menu.removeChild(menu.firstChild);
            LANGS.forEach(function(l) {
                var item = document.createElement('div');
                item.className = 'lang-item';
                item.setAttribute('data-lang', l.code);
                var flag = document.createElement('span');
                flag.className = 'lang-flag';
                flag.innerHTML = FLAG_SVG[l.code];
                var name = document.createElement('span');
                name.textContent = l.name;
                item.appendChild(flag);
                item.appendChild(name);
                item.addEventListener('click', function() {
                    setUILanguage(l.code, true);
                    toggleLangMenu(false);
                });
                menu.appendChild(item);
            });
        }

        function toggleLangMenu(show) {
            var menu = document.getElementById('lang-menu');
            if (show === undefined) show = !menu.classList.contains('open');
            menu.classList.toggle('open', show);
        }

        // =====================================================================
        // Tauri init / config
        // =====================================================================

        function initTauri() {
            if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                invoke = window.__TAURI__.core.invoke;
                logLine('Tauri API ready', 'success');
                setupDragDrop();
                setupCloseGuard();
                loadAppConfig();
                return true;
            }
            return false;
        }

        function loadAppConfig() {
            invoke('get_config')
                .then(function(info) {
                    appConfig = info.config || null;
                    if (info.error) {
                        logLine('Config error: ' + info.error + ' (using defaults)', 'warning');
                    } else if (info.path) {
                        logLine('Config: ' + info.path, 'info');
                    } else {
                        logLine('No d2h.config.json found — using neutral defaults', 'info');
                    }
                    resolveUILanguageFromConfig(info.osLocale);
                    applyConfigDefaults();
                })
                .catch(function(e) {
                    logLine('get_config error: ' + e, 'error');
                });
        }

        // Resolve output dirs for a source path, per format: a matching job-id
        // rule wins over settings defaults; null = deferred (ask when saving).
        function resolveOutputDirs(dirPath) {
            var d = (appConfig && appConfig.defaults) || {};
            var out = { web: d.webOutputDir || null, html: d.htmlOutputDir || null };
            var rules = (appConfig && appConfig.jobId && appConfig.jobId.rules) || [];
            if (dirPath && rules.length) {
                var sep = dirPath.indexOf('\\') >= 0 ? '\\' : '/';
                var parts = dirPath.split(sep).filter(function(p) { return p.length > 0; });
                var dirName = parts[parts.length - 1] || '';
                for (var i = 0; i < rules.length; i++) {
                    var re;
                    try { re = new RegExp(rules[i].match); } catch (e) { continue; }
                    if (!re.test(dirName)) continue;
                    if (rules[i].webOutputDir) out.web = rules[i].webOutputDir;
                    if (rules[i].htmlOutputDir) out.html = rules[i].htmlOutputDir;
                    break; // first match wins
                }
            }
            return out;
        }

        function parentDir(path) {
            var sep = path.indexOf('\\') >= 0 ? '\\' : '/';
            var idx = path.lastIndexOf(sep);
            return idx > 0 ? path.substring(0, idx) : path;
        }

        // Resolution order: localStorage (explicit flag click) -> config
        // defaults.uiLanguage -> OS locale (from the backend) -> navigator -> 'en'.
        // The navigator-based default is already applied at startup; here we
        // upgrade it once get_config delivers the config and the OS locale.
        function resolveUILanguageFromConfig(osLocale) {
            if (lsGet('d2h_ui_lang')) return;
            if (appConfig && appConfig.defaults && appConfig.defaults.uiLanguage && UI[appConfig.defaults.uiLanguage]) {
                setUILanguage(appConfig.defaults.uiLanguage, false);
                return;
            }
            var osLang = mapLocale(osLocale);
            if (osLang && osLang !== uiLang) setUILanguage(osLang, false);
        }

        function applyConfigDefaults() {
            if (!appConfig || !appConfig.defaults) { updateGenerateButton(); return; }
            var d = appConfig.defaults;
            if (d.theme) document.getElementById('opt-theme').value = d.theme;
            updateGenerateButton();
        }

        // Try init immediately, then retry if needed
        if (!initTauri()) {
            document.addEventListener('DOMContentLoaded', function() {
                if (!initTauri()) {
                    // Retry with delay
                    setTimeout(function() {
                        if (!initTauri()) {
                            logLine('ERROR: Tauri API not available. __TAURI__=' + typeof window.__TAURI__, 'error');
                        }
                    }, 1000);
                }
            });
        }

        // --- Drag & drop (Tauri v2 file drop events) ---
        function setupDragDrop() {
            if (dragDropSetupDone) return;
            if (!(window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen)) return;
            dragDropSetupDone = true;
            var listen = window.__TAURI__.event.listen;
            var dz = document.getElementById('drop-zone');
            try {
                listen('tauri://drag-drop', function(e) {
                    if (dz) dz.classList.remove('dragging');
                    var p = e && e.payload && e.payload.paths && e.payload.paths[0];
                    if (p) {
                        setSourceDir(p);
                        applyAutoDefaults(p);
                        updateGenerateButton();
                    }
                });
                listen('tauri://drag-over', function() {
                    if (dz) dz.classList.add('dragging');
                });
                listen('tauri://drag-enter', function() {
                    if (dz) dz.classList.add('dragging');
                });
                listen('tauri://drag-leave', function() {
                    if (dz) dz.classList.remove('dragging');
                });
            } catch (err) {
                logLine('Drag&drop setup error: ' + err, 'warning');
            }
        }

        // --- Directory / File Pickers ---

        // Update the source drop-zone: empty hint vs. selected-folder chip
        // (name + full path, truncated from the left). The hidden #input-dir
        // stays the single source of truth for the rest of the logic.
        function setSourceDir(p) {
            document.getElementById('input-dir').value = p || '';
            // Class on the parent drives which child shows (see CSS note).
            document.getElementById('drop-zone').classList.toggle('selected', !!p);
            if (p) {
                var sep = p.indexOf('\\') >= 0 ? '\\' : '/';
                var parts = p.split(sep).filter(function(x) { return x.length > 0; });
                document.getElementById('dz-name').textContent = parts[parts.length - 1] || p;
                // LRM keeps the leading slash rendering sane under direction:rtl
                document.getElementById('dz-path').textContent = '‎' + p;
            }
        }

        function pickDirectory() {
            logLine('pickDirectory() called', 'info');
            if (!invoke) { logLine('Tauri not ready', 'error'); return; }
            invoke('pick_directory', { title: 'Select directory to scan' })
                .then(function(dir) {
                    logLine('pick_directory result: ' + dir, 'info');
                    if (dir) {
                        setSourceDir(dir);
                        applyAutoDefaults(dir);
                        updateGenerateButton();
                    }
                })
                .catch(function(e) {
                    logLine('pick_directory error: ' + e, 'error');
                });
        }

        // Auto-defaults are driven entirely by jobId.rules from d2h.config.json —
        // each rule is { match: <regex>, language?, theme?, webOutputDir?, htmlOutputDir? }.
        // First rule whose regex matches the source directory name wins.
        // Without a config file nothing happens (neutral public behavior).
        function applyAutoDefaults(dirPath) {
            ruleCatalogLang = null; // reset per selected source
            if (!appConfig || !appConfig.jobId || !appConfig.jobId.rules) return;
            var sep = dirPath.indexOf('\\') >= 0 ? '\\' : '/';
            var parts = dirPath.split(sep).filter(function(p) { return p.length > 0; });
            var dirName = parts[parts.length - 1] || '';

            var rules = appConfig.jobId.rules;
            for (var i = 0; i < rules.length; i++) {
                var rule = rules[i];
                var re;
                try { re = new RegExp(rule.match); } catch (e) {
                    logLine('Config: invalid rule regex "' + rule.match + '"', 'warning');
                    continue;
                }
                if (!re.test(dirName)) continue;

                if (rule.language) ruleCatalogLang = rule.language;
                if (rule.theme) document.getElementById('opt-theme').value = rule.theme;
                logLine('Auto: rule ' + (i + 1) + ' matched "' + dirName + '"' +
                    (rule.language ? ' → lang ' + rule.language : '') +
                    (rule.webOutputDir ? ' → ' + rule.webOutputDir : ''), 'info');
                return; // first match wins
            }
        }

        // --- Format cards <-> hidden checkboxes ---

        function syncFormatCards() {
            [['card-web', 'opt-web'], ['card-html', 'opt-html']].forEach(function(pair) {
                var card = document.getElementById(pair[0]);
                var cb = document.getElementById(pair[1]);
                card.classList.toggle('selected', cb.checked);
                card.setAttribute('aria-checked', cb.checked ? 'true' : 'false');
            });
        }

        function toggleFormat(checkboxId) {
            var cb = document.getElementById(checkboxId);
            var other = document.getElementById(checkboxId === 'opt-web' ? 'opt-html' : 'opt-web');
            // At least one format must stay selected
            if (cb.checked && !other.checked) {
                var cardId = checkboxId === 'opt-web' ? 'card-web' : 'card-html';
                var card = document.getElementById(cardId);
                card.classList.remove('shake');
                void card.offsetWidth; // restart the animation
                card.classList.add('shake');
                return;
            }
            cb.checked = !cb.checked;
            syncFormatCards();
            updateGenerateButton();
        }

        function updateGenerateButton() {
            var dir = document.getElementById('input-dir').value;
            var anyFormat = document.getElementById('opt-web').checked
                || document.getElementById('opt-html').checked;
            document.getElementById('btn-generate').disabled = !dir || !anyFormat || generating;
        }

        // --- Logging ---

        function logLine(text, type) {
            // Skip raw dialog JSON dumps
            if (typeof text === 'string' && text.indexOf('Dialog: {') === 0) return;
            var log = document.getElementById('log-content');
            var line = document.createElement('div');
            line.className = 'log-line' + (type ? ' ' + type : '');
            line.textContent = text;
            log.appendChild(line);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            var log = document.getElementById('log-content');
            while (log.firstChild) log.removeChild(log.firstChild);
        }

        function setLogExpanded(open) {
            document.getElementById('log-section').classList.toggle('open', open);
        }

        // =====================================================================
        // Status card (right panel)
        // =====================================================================

        var statusState = 'idle'; // idle | generating | success | error
        var statusData = null;

        function setStatus(state, data) {
            statusState = state;
            statusData = data;
            renderStatus();
        }

        function renderStatus() {
            var card = document.getElementById('status-card');
            if (!card) return;
            while (card.firstChild) card.removeChild(card.firstChild);
            card.className = 'status-card ' + statusState;

            if (statusState === 'idle') {
                card.appendChild(document.createTextNode(t('statusIdle')));

            } else if (statusState === 'generating') {
                var row = document.createElement('div');
                row.className = 'status-progress';
                var spin = document.createElement('div');
                spin.className = 'spinner';
                row.appendChild(spin);
                var msg = document.createElement('div');
                msg.id = 'progress-text';
                msg.textContent = (statusData && statusData.msg) || t('generating');
                row.appendChild(msg);
                card.appendChild(row);

                var barWrap = document.createElement('div');
                barWrap.className = 'progress-bar-wrapper';
                var bar = document.createElement('div');
                bar.id = 'progress-bar';
                bar.className = 'progress-bar indeterminate';
                barWrap.appendChild(bar);
                card.appendChild(barWrap);

            } else if (statusState === 'success') {
                var result = statusData || {};
                var title = document.createElement('div');
                title.className = 'status-title';
                title.textContent = '✔ ' + t('done');
                card.appendChild(title);

                var line1 = document.createElement('div');
                line1.className = 'status-line';
                var b1 = document.createElement('b');
                b1.textContent = result.totalFiles;
                line1.appendChild(b1);
                line1.appendChild(document.createTextNode(' ' + t('filesIn') + ' '));
                var b2 = document.createElement('b');
                b2.textContent = result.totalDirs;
                line1.appendChild(b2);
                line1.appendChild(document.createTextNode(' ' + t('foldersParen') + ' (' + result.totalSize + ')'));
                card.appendChild(line1);

                // Saved state per format: direct writes count as saved,
                // deferred ones only once the user stored them somewhere.
                var savedTar = result.tarGzPath
                    ? (result.tarGzDeferred ? result.savedTarGzPath : result.tarGzPath)
                    : null;
                var savedHtml = result.htmlPath
                    ? (result.htmlDeferred ? result.savedHtmlPath : result.htmlPath)
                    : null;
                if (result.tarGzPath) {
                    var lineTar = document.createElement('div');
                    lineTar.className = 'status-line ' + (savedTar ? 'ok' : 'warn');
                    lineTar.textContent = savedTar
                        ? ('✓ tar.gz: ' + savedTar)
                        : ('tar.gz: ' + t('notSavedYet'));
                    card.appendChild(lineTar);
                }
                if (result.htmlPath) {
                    var lineHtml = document.createElement('div');
                    lineHtml.className = 'status-line ' + (savedHtml ? 'ok' : 'warn');
                    lineHtml.textContent = savedHtml
                        ? ('✓ HTML: ' + savedHtml)
                        : ('HTML: ' + t('notSavedYet'));
                    card.appendChild(lineHtml);
                }
                if (result.warnings > 0) {
                    var warnLine = document.createElement('div');
                    warnLine.className = 'status-line warn';
                    warnLine.textContent = '⚠ ' + result.warnings + ' ' + t('warnings');
                    warnLine.style.cursor = 'pointer';
                    warnLine.style.textDecoration = 'underline';
                    warnLine.title = t('warningsClickHint');
                    warnLine.onclick = function() {
                        setLogExpanded(true);
                        var logSection = document.getElementById('log-section');
                        if (logSection) logSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    };
                    card.appendChild(warnLine);
                }

                // Offer to remember the folder chosen in the Save dialog
                // (deferred formats only; writes into settings on click).
                if (result.offerRemember) {
                    var remLine = document.createElement('div');
                    remLine.className = 'status-line';
                    remLine.appendChild(document.createTextNode(t('rememberFolder') + ' '));
                    var remBtn = document.createElement('button');
                    remBtn.className = 'btn';
                    remBtn.textContent = t('yes');
                    remBtn.onclick = function() { rememberSaveFolder(result.offerRemember); };
                    remLine.appendChild(remBtn);
                    card.appendChild(remLine);
                }

                var actions = document.createElement('div');
                actions.className = 'status-actions';
                if (lastOutputDir) {
                    var btnFolder = document.createElement('button');
                    btnFolder.className = 'btn';
                    btnFolder.textContent = t('openFolder');
                    btnFolder.onclick = function() { openOutputFolder(); };
                    actions.appendChild(btnFolder);
                }
                if (result.htmlPath) {
                    var btnHtml = document.createElement('button');
                    btnHtml.className = 'btn';
                    btnHtml.textContent = savedHtml ? t('openHtml') : t('preview');
                    btnHtml.onclick = function() {
                        if (invoke) {
                            // Prefer the saved copy once it exists.
                            invoke('open_path', { path: savedHtml || result.htmlPath })
                                .catch(function(e) { logLine('open_path error: ' + e, 'error'); });
                        }
                    };
                    actions.appendChild(btnHtml);
                    var btnSaveHtml = document.createElement('button');
                    btnSaveHtml.className = 'btn' + (savedHtml ? '' : ' btn-primary');
                    btnSaveHtml.textContent = savedHtml ? t('saveHtmlElsewhere') : t('saveHtml');
                    btnSaveHtml.onclick = function() { saveResult('html'); };
                    actions.appendChild(btnSaveHtml);
                }
                if (result.tarGzPath) {
                    var btnSaveTar = document.createElement('button');
                    btnSaveTar.className = 'btn'
                        + (!savedTar && !(result.htmlPath && !savedHtml) ? ' btn-primary' : '');
                    btnSaveTar.textContent = savedTar ? t('saveTarGzElsewhere') : t('saveTarGz');
                    btnSaveTar.onclick = function() { saveResult('tar.gz'); };
                    actions.appendChild(btnSaveTar);
                }
                card.appendChild(actions);

            } else if (statusState === 'error') {
                var etitle = document.createElement('div');
                etitle.className = 'status-title';
                etitle.textContent = '✖ Error';
                card.appendChild(etitle);
                var eline = document.createElement('div');
                eline.className = 'status-line';
                eline.textContent = String(statusData || '');
                card.appendChild(eline);
            }
        }

        // --- Generate ---

        async function doGenerate() {
            var dir = document.getElementById('input-dir').value;
            if (!dir) return;

            var generateWeb = document.getElementById('opt-web').checked;
            var generateHtml = document.getElementById('opt-html').checked;
            // Per-format: configured dir (settings/rules) = direct write,
            // no dir = deferred (native Save dialog after generation).
            var dirs = resolveOutputDirs(dir);
            var webDeferred = generateWeb && !dirs.web;
            var htmlDeferred = generateHtml && !dirs.html;
            var webOutput = (generateWeb && !webDeferred) ? dirs.web : '';
            var htmlOutput = (generateHtml && !htmlDeferred) ? dirs.html : '';

            generating = true;
            updateGenerateButton();
            clearLog();
            setStatus('generating', { msg: t('starting') });

            var titleVal = document.getElementById('input-title').value.trim();

            var args = {
                dir: dir,
                webOutput: webOutput || '',
                htmlOutput: htmlOutput || '',
                title: titleVal.length > 0 ? titleVal : null,
                hidden: document.getElementById('opt-hidden').checked,
                includeZeroSize: document.getElementById('opt-zero-size').checked,
                includeEmptyDirs: document.getElementById('opt-empty-dirs').checked,
                followSymlinks: document.getElementById('opt-symlinks').checked,
                showPackages: document.getElementById('opt-packages').checked,
                generateWeb: generateWeb,
                generateHtml: generateHtml,
                lang: effectiveCatalogLang(),
                theme: document.getElementById('opt-theme').value,
                webDeferred: webDeferred,
                htmlDeferred: htmlDeferred,
            };

            logLine('D2H v1.7.0-beta', 'info');
            logLine('Source: ' + dir, 'info');
            if (generateWeb) logLine('Web output: ' + (webDeferred ? 'choose after generation' : webOutput), 'info');
            if (generateHtml) logLine('HTML output: ' + (htmlDeferred ? 'choose after generation' : htmlOutput), 'info');
            logLine('Catalog language: ' + args.lang, 'info');
            logLine('---');

            // Start progress polling
            var pollInterval = setInterval(async function() {
                try {
                    var p = await invoke('get_progress');
                    if (p.question && !document.getElementById('dialog-modal')) {
                        logLine('Dialog: ' + JSON.stringify(p.question), 'info');
                        showDialogModal(p.question);
                    }
                    if (!p.question) {
                        if (statusData) statusData.msg = p.message;
                        var progressText = document.getElementById('progress-text');
                        if (progressText) progressText.textContent = p.message;
                        logLine(p.message);
                    }
                } catch (e) {}
            }, 500);

            try {
                var result = await invoke('generate', { args: args });

                clearInterval(pollInterval);

                logLine('---');
                logLine('Files: ' + result.totalFiles + ' in ' + result.totalDirs + ' folders (' + result.totalSize + ')', 'success');
                if (result.tarGzPath) {
                    logLine('tar.gz: ' + result.tarGzPath, 'success');
                }
                if (result.htmlPath) {
                    logLine('HTML: ' + result.htmlPath, 'success');
                }
                logLine('Chunks: ' + result.chunks, 'success');
                if (result.warnings > 0) {
                    logLine('Warnings: ' + result.warnings, 'warning');
                    (result.warningMessages || []).forEach(function(msg) {
                        logLine('  ' + msg, 'warning');
                    });
                }
                logLine('Done!', 'success');

                // "Open folder" points at a directly-written output only
                // (deferred files sit in temp until saved).
                lastOutputDir = null;
                if (result.tarGzPath && !result.tarGzDeferred) lastOutputDir = parentDir(result.tarGzPath);
                else if (result.htmlPath && !result.htmlDeferred) lastOutputDir = parentDir(result.htmlPath);
                setStatus('success', result);

                // Deferred formats: offer the Save dialog right away — nothing
                // opens unsaved. The saved HTML then opens automatically;
                // directly-written outputs open only on user action.
                if (result.htmlDeferred) {
                    var savedDest = await saveResult('html');
                    if (savedDest) invoke('open_path', { path: savedDest });
                }
                if (result.tarGzDeferred) {
                    await saveResult('tar.gz');
                }

            } catch (e) {
                clearInterval(pollInterval);
                logLine('ERROR: ' + e, 'error');
                setStatus('error', String(e));
                setLogExpanded(true);
            }

            generating = false;
            updateGenerateButton();
        }

        // --- Actions ---

        // Native Save-as dialog + copy of a generated file (from the temp
        // result dir, or a copy of a directly-written output). Cancelled
        // dialog resolves to null; the source stays, so the user can save
        // repeatedly (e.g. to a second location). Returns a promise with the
        // saved path (or null).
        function saveResult(kind) {
            var result = statusData;
            if (!result || !invoke) return Promise.resolve(null);
            var src = kind === 'html' ? result.htmlPath : result.tarGzPath;
            if (!src) return Promise.resolve(null);
            var name = result.suggestedName + (kind === 'html' ? '.html' : '.tar.gz');
            return invoke('save_file_as', { sourcePath: src, suggestedName: name, ext: kind })
                .then(function(dest) {
                    if (!dest) return null; // dialog cancelled
                    var wasDeferred;
                    if (kind === 'html') {
                        result.savedHtmlPath = dest;
                        wasDeferred = result.htmlDeferred;
                    } else {
                        result.savedTarGzPath = dest;
                        wasDeferred = result.tarGzDeferred;
                    }
                    // Offer "always save here?" only for deferred formats —
                    // direct formats already have a configured folder.
                    if (wasDeferred) result.offerRemember = kind;
                    logLine(t('savedTo') + ' ' + dest, 'success');
                    renderStatus();
                    return dest;
                })
                .catch(function(e) {
                    logLine('Save error: ' + e, 'error');
                    return null;
                });
        }

        // "Always save to this folder?" — write the folder of the last saved
        // file into settings (user config; an exe-adjacent deployment config
        // still has priority, so internal setups are unaffected).
        function rememberSaveFolder(kind) {
            var result = statusData;
            if (!result || !invoke) return;
            var dest = kind === 'html' ? result.savedHtmlPath : result.savedTarGzPath;
            if (!dest) return;
            var folder = parentDir(dest);
            if (!appConfig) appConfig = { branding: {}, defaults: {}, jobId: {} };
            if (!appConfig.defaults) appConfig.defaults = {};
            if (kind === 'html') appConfig.defaults.htmlOutputDir = folder;
            else appConfig.defaults.webOutputDir = folder;
            invoke('save_config', { config: appConfig })
                .then(function(savedPath) {
                    logLine(t('savedTo') + ' ' + savedPath, 'success');
                    result.offerRemember = null;
                    renderStatus();
                })
                .catch(function(e) { logLine('save_config error: ' + e, 'error'); });
        }

        function hasUnsavedResult() {
            if (statusState !== 'success' || !statusData) return false;
            if (statusData.htmlDeferred && statusData.htmlPath && !statusData.savedHtmlPath) return true;
            if (statusData.tarGzDeferred && statusData.tarGzPath && !statusData.savedTarGzPath) return true;
            return false;
        }

        function showUnsavedModal(win) {
            if (document.getElementById('unsaved-modal')) return;
            var modal = document.createElement('div');
            modal.id = 'unsaved-modal';
            var overlay = document.createElement('div');
            overlay.className = 'dialog-overlay';
            var box = document.createElement('div');
            box.className = 'dialog-box';
            var titleEl = document.createElement('div');
            titleEl.className = 'dialog-title';
            titleEl.textContent = t('unsavedTitle');
            var msgEl = document.createElement('div');
            msgEl.className = 'dialog-message';
            msgEl.textContent = t('unsavedMsg');
            var btns = document.createElement('div');
            btns.className = 'dialog-buttons';
            var btnBack = document.createElement('button');
            btnBack.className = 'btn btn-primary';
            btnBack.textContent = t('goBack');
            btnBack.addEventListener('click', function() { modal.remove(); });
            var btnClose = document.createElement('button');
            btnClose.className = 'btn btn-warning';
            btnClose.textContent = t('closeAnyway');
            btnClose.addEventListener('click', function() { win.destroy(); });
            btns.appendChild(btnBack);
            btns.appendChild(btnClose);
            box.appendChild(titleEl);
            box.appendChild(msgEl);
            box.appendChild(btns);
            overlay.appendChild(box);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) modal.remove();
            });
            modal.appendChild(overlay);
            document.body.appendChild(modal);
        }

        // Warn before closing the window while a deferred result is unsaved.
        function setupCloseGuard() {
            try {
                if (!(window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow)) return;
                var win = window.__TAURI__.window.getCurrentWindow();
                win.onCloseRequested(function(event) {
                    if (!hasUnsavedResult()) return;
                    event.preventDefault();
                    showUnsavedModal(win);
                });
            } catch (e) {
                logLine('Close guard setup error: ' + e, 'warning');
            }
        }

        async function openOutputFolder() {
            if (lastOutputDir) {
                try {
                    await invoke('open_path', { path: lastOutputDir });
                } catch (e) {
                    logLine('Error opening folder: ' + e, 'error');
                }
            }
        }

        // =====================================================================
        // Customize modal (branding: logo, header background, footer)
        // =====================================================================

        // Normalize a #rgb/#rgba/#rrggbb/#rrggbbaa hex to the #rrggbb form that
        // <input type="color"> accepts; anything else falls back to the default.
        function normalizeHexColor(h, fallback) {
            if (/^#[0-9a-fA-F]{3,4}$/.test(h)) {
                return ('#' + h[1] + h[1] + h[2] + h[2] + h[3] + h[3]).toLowerCase();
            }
            if (/^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(h)) {
                return h.slice(0, 7).toLowerCase();
            }
            return fallback;
        }

        function showCustomizeModal() {
            var old = document.getElementById('customize-modal');
            if (old) old.remove();

            var branding = (appConfig && appConfig.branding) || {};
            var logoValue = branding.logoPath || null;
            var bgDirty = false;

            var modal = document.createElement('div');
            modal.id = 'customize-modal';

            var overlay = document.createElement('div');
            overlay.className = 'dialog-overlay';
            var box = document.createElement('div');
            box.className = 'dialog-box';

            var titleEl = document.createElement('div');
            titleEl.className = 'dialog-title';
            titleEl.textContent = t('customize');
            box.appendChild(titleEl);

            // --- Logo ---
            var logoField = document.createElement('div');
            logoField.className = 'cust-field';
            var logoLabel = document.createElement('label');
            logoLabel.textContent = t('custLogo');
            logoField.appendChild(logoLabel);
            var logoRow = document.createElement('div');
            logoRow.className = 'cust-row';
            var logoInput = document.createElement('input');
            logoInput.type = 'text';
            logoInput.readOnly = true;
            logoInput.value = logoValue || '';
            logoRow.appendChild(logoInput);
            var logoBrowseBtn = document.createElement('button');
            logoBrowseBtn.className = 'btn';
            logoBrowseBtn.textContent = t('browse');
            logoBrowseBtn.addEventListener('click', function() {
                if (!invoke) { logLine('Tauri not ready', 'error'); return; }
                invoke('pick_file', { title: t('custLogo') })
                    .then(function(p) {
                        if (p) {
                            logoValue = p;
                            logoInput.value = p;
                        }
                    })
                    .catch(function(e) { logLine('pick_file error: ' + e, 'error'); });
            });
            logoRow.appendChild(logoBrowseBtn);
            var logoClearBtn = document.createElement('button');
            logoClearBtn.className = 'btn btn-clear';
            logoClearBtn.textContent = '×';
            logoClearBtn.title = t('clear');
            logoClearBtn.addEventListener('click', function() {
                logoValue = null;
                logoInput.value = '';
            });
            logoRow.appendChild(logoClearBtn);
            logoField.appendChild(logoRow);
            box.appendChild(logoField);

            // --- Header background (solid color or 45deg gradient) ---
            var DEFAULT_BG = '#2B395C';
            var prefill1 = DEFAULT_BG, prefill2 = DEFAULT_BG, prefillGrad = false;
            var hb = branding.headerBackground;
            if (typeof hb === 'string') {
                var gm = hb.match(/linear-gradient\(45deg,\s*(#[0-9a-fA-F]{3,8})[^,]*,\s*(#[0-9a-fA-F]{3,8})/);
                if (gm) {
                    prefill1 = normalizeHexColor(gm[1], DEFAULT_BG);
                    prefill2 = normalizeHexColor(gm[2], DEFAULT_BG);
                    prefillGrad = true;
                } else if (/^#[0-9a-fA-F]{3,8}$/.test(hb.trim())) {
                    prefill1 = normalizeHexColor(hb.trim(), DEFAULT_BG);
                }
            }

            var bgField = document.createElement('div');
            bgField.className = 'cust-field';
            var bgLabel = document.createElement('label');
            bgLabel.textContent = t('custBackground');
            bgField.appendChild(bgLabel);
            var bgRow = document.createElement('div');
            bgRow.className = 'cust-row';

            var color1 = document.createElement('input');
            color1.type = 'color';
            color1.value = prefill1;
            color1.title = t('custColor1');
            bgRow.appendChild(color1);

            var gradToggle = document.createElement('label');
            gradToggle.className = 'toggle';
            var gradCheck = document.createElement('input');
            gradCheck.type = 'checkbox';
            gradCheck.checked = prefillGrad;
            gradToggle.appendChild(gradCheck);
            var gradText = document.createElement('span');
            gradText.textContent = t('custGradient');
            gradToggle.appendChild(gradText);
            bgRow.appendChild(gradToggle);

            var color2 = document.createElement('input');
            color2.type = 'color';
            color2.value = prefill2;
            color2.title = t('custColor2');
            color2.disabled = !prefillGrad;
            bgRow.appendChild(color2);

            function markBgDirty() { bgDirty = true; }
            color1.addEventListener('input', markBgDirty);
            color2.addEventListener('input', markBgDirty);
            gradCheck.addEventListener('change', function() {
                bgDirty = true;
                color2.disabled = !gradCheck.checked;
            });

            bgField.appendChild(bgRow);
            box.appendChild(bgField);

            // --- Catalog language (empty = follow the app UI language) ---
            var defaults = (appConfig && appConfig.defaults) || {};
            var langField = document.createElement('div');
            langField.className = 'cust-field';
            var langLabel = document.createElement('label');
            langLabel.textContent = t('catalogLanguage');
            langField.appendChild(langLabel);
            var langSel = document.createElement('select');
            langSel.className = 'd2h-select';
            var LANG_NAMES = { en: 'English', cz: 'Čeština', de: 'Deutsch', it: 'Italiano', es: 'Español', fr: 'Français', pl: 'Polski' };
            var optAuto = document.createElement('option');
            optAuto.value = '';
            optAuto.textContent = t('sameAsAppLang');
            langSel.appendChild(optAuto);
            CATALOG_LANGS.forEach(function(code) {
                var o = document.createElement('option');
                o.value = code;
                o.textContent = LANG_NAMES[code];
                langSel.appendChild(o);
            });
            langSel.value = (defaults.language && CATALOG_LANGS.indexOf(defaults.language) >= 0) ? defaults.language : '';
            langField.appendChild(langSel);
            box.appendChild(langField);

            // --- Output directories (empty = ask where to save after generation) ---
            function makeDirField(labelKey, initial) {
                var state = { value: initial || null };
                var field = document.createElement('div');
                field.className = 'cust-field';
                var label = document.createElement('label');
                label.textContent = t(labelKey);
                field.appendChild(label);
                var row = document.createElement('div');
                row.className = 'cust-row';
                var input = document.createElement('input');
                input.type = 'text';
                input.readOnly = true;
                input.value = state.value || '';
                input.placeholder = t('askWhenEmpty');
                row.appendChild(input);
                var browseBtn = document.createElement('button');
                browseBtn.className = 'btn';
                browseBtn.textContent = t('browse');
                browseBtn.addEventListener('click', function() {
                    if (!invoke) { logLine('Tauri not ready', 'error'); return; }
                    invoke('pick_directory', { title: t(labelKey) })
                        .then(function(p) {
                            if (p) { state.value = p; input.value = p; }
                        })
                        .catch(function(e) { logLine('pick_directory error: ' + e, 'error'); });
                });
                row.appendChild(browseBtn);
                var clearBtn = document.createElement('button');
                clearBtn.className = 'btn btn-clear';
                clearBtn.textContent = '×';
                clearBtn.title = t('clear');
                clearBtn.addEventListener('click', function() {
                    state.value = null;
                    input.value = '';
                });
                row.appendChild(clearBtn);
                field.appendChild(row);
                return { field: field, state: state };
            }
            var htmlDirField = makeDirField('htmlOutputDir', defaults.htmlOutputDir);
            var webDirField = makeDirField('webOutputDir', defaults.webOutputDir);
            box.appendChild(htmlDirField.field);
            box.appendChild(webDirField.field);

            // Footer is intentionally NOT editable in the UI — the attribution
